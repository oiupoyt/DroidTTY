name: android

on:
  push:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # All three store builds compile and pass lint; unit tests run once, on the sideloaded build.
      - name: Assemble + lint + unit tests
        run: >-
          ./gradlew --stacktrace
          :app:assembleGithubDebug :app:assembleFdroidDebug :app:assemblePlayDebug
          :app:lintGithubDebug :app:lintFdroidDebug :app:lintPlayDebug
          :app:testGithubDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testGithubDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-frames
          path: app/build/gallery/frames.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
