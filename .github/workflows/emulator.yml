name: emulator

on:
  push:
    branches: [main, emulator-tests]
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/emulator.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/emulator.yml"]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: google_apis
          - api-level: 31
            target: google_apis
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Built before the emulator starts, so it boots only for the tests.
      - name: Build app and test APKs
        run: ./gradlew --stacktrace :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-x86_64

      - name: Create AVD and snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --stacktrace :app:connectedGithubDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
