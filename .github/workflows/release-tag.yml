name: release-tag

# Builds a signed release APK for a pushed version tag (v1.2.3) and publishes
# it as a permanent GitHub Release at that tag. F-Droid's reproducible-build
# check (Binaries + AllowedAPKSigningKeys in .fdroid.yml) diffs its own
# from-source build against this file, so it must never be overwritten.
#
# Signing secrets: see release.yml. Without them the APK is unsigned and
# won't match AllowedAPKSigningKeys.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (skipped if that release exists)"
        required: true

permissions:
  contents: write

# GitHub now and then delivers one tag push twice. Runs for the same tag go one
# at a time, and the later one finds the release and stops without failing.
concurrency:
  group: release-tag-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; it is never rebuilt or replaced (F-Droid compares against it)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  release-tag:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same major version as F-Droid's build server, so its from-source
          # build can match this APK byte for byte.
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              # Absolute path: app/build.gradle.kts resolves storeFile against the
              # :app module dir, so a bare relative name would miss.
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            echo "Release signing configured."
          else
            echo "No RELEASE_KEYSTORE_B64 secret — APK will be unsigned."
          fi

      # The sideloaded APK, the F-Droid APK (for F-Droid's reproducible-build check) and the
      # Play bundle, all signed with the same key.
      - name: Assemble release
        run: ./gradlew :app:assembleGithubRelease :app:assembleFdroidRelease :app:bundlePlayRelease --stacktrace

      - name: Stage APK
        id: stage
        run: |
          set -e
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp "$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)" release-artifacts/DroidTTY.apk
          cp "$(find app/build/outputs/apk/fdroid/release -name '*.apk' | head -1)" release-artifacts/DroidTTY-fdroid.apk
          cp "$(find app/build/outputs/bundle/playRelease -name '*.aab' | head -1)" release-artifacts/DroidTTY-play.aab
          # Read by the F-Droid build's update check (releases/latest/download/version.json).
          NOTES="metadata/en-US/changelogs/$VCODE.txt"
          python3 -c 'import json,sys,os; print(json.dumps({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2], "apk": sys.argv[3], "notes": open(sys.argv[4]).read().strip() if os.path.exists(sys.argv[4]) else ""}))' \
            "$VCODE" "$VNAME" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/DroidTTY.apk" "$NOTES" \
            > release-artifacts/version.json

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NOTES="metadata/en-US/changelogs/$VCODE.txt"
          {
            [ -f "$NOTES" ] && cat "$NOTES" && echo
            echo "Install: https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/DroidTTY.apk"
            echo
            echo "DroidTTY-fdroid.apk is the F-Droid build (updates come through F-Droid); DroidTTY-play.aab is the bundle for Google Play."
            echo
            echo "Signing certificate SHA-256: 39caf48edfbc24d784220093324df2efab10620f457a01ba68a6e1b58ac277e8"
          } > release-notes.md
          gh release create "$TAG" release-artifacts/DroidTTY.apk release-artifacts/DroidTTY-fdroid.apk \
            release-artifacts/DroidTTY-play.aab release-artifacts/version.json \
            --title "DroidTTY ${{ steps.stage.outputs.vname }}" \
            --notes-file release-notes.md

      # Skipped quietly without the FORGEJO_TOKEN secret (forks of this fork).
      - name: Mirror to Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          if [ -z "$FORGEJO_TOKEN" ]; then echo "no FORGEJO_TOKEN; not mirroring"; exit 0; fi
          tools/forgejo-release.sh "${{ inputs.tag || github.ref_name }}" "DroidTTY ${{ steps.stage.outputs.vname }}" release-notes.md release-artifacts/DroidTTY.apk
