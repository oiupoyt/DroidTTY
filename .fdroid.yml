Categories:
  - Launcher
  - Network Analyzer
  - System
License: GPL-3.0-only
AuthorName: oiupoyt
WebSite: https://droidtty.oiupoyt.space
SourceCode: https://github.com/oiupoyt/DroidTTY
IssueTracker: https://github.com/oiupoyt/DroidTTY/issues
Changelog: https://github.com/oiupoyt/DroidTTY/blob/HEAD/metadata/en-US/changelogs/%c.txt

# Summary/Description are intentionally omitted: the fastlane-structured
# metadata/en-US/{title,short_description,full_description}.txt in this repo is
# the single source of truth.
AutoName: DroidTTY

RepoType: git
Repo: https://github.com/oiupoyt/DroidTTY.git
# Each version tag also publishes a GitHub Release at that tag
# (.github/workflows/release-tag.yml) carrying the identical, developer-signed
# APK, so F-Droid's reproducible-build check can diff its own build against it.
Binaries: https://github.com/oiupoyt/DroidTTY/releases/download/v%v/DroidTTY.apk

Builds:
  - versionName: 0.5.6
    versionCode: 19
    # The tag rather than a hash: this file is part of the tagged commit.
    commit: v0.5.6
    subdir: app
    gradle:
      - yes

  - versionName: 0.5.7
    versionCode: 20
    # The tag rather than a hash: this file is part of the tagged commit.
    commit: v0.5.7
    # The Gradle root is the repo root; F-Droid looks for the output APK under
    # <subdir>/build/outputs/apk, so this must be the app module itself.
    subdir: app
    gradle:
      - yes

# SHA-256 of the fork's signing certificate (release.yml / release-tag.yml sign with it).
AllowedAPKSigningKeys: 39caf48edfbc24d784220093324df2efab10620f457a01ba68a6e1b58ac277e8

AutoUpdateMode: Version
# Only vX.Y.Z tags are releases; `latest` is CI's rolling pre-release build.
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.5.7
CurrentVersionCode: 20
